name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez, y sin cancelar el que esté en curso: dejar Pages a
# medias es peor que esperar.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  WASM_PACK_VERSION: v0.13.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Instalar wasm-pack
        run: |
          set -euo pipefail
          name="wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/${name}.tar.gz" \
            | tar xz -C /tmp
          install -m 755 "/tmp/${name}/wasm-pack" /usr/local/bin/wasm-pack

      - name: Compilar el WASM
        run: wasm-pack build crates/totp-web --target web --out-dir ../../web/pkg --release --no-typescript

      - name: Comprobar que el WASM salió
        run: test -s web/pkg/totp_web_bg.wasm && test -s web/pkg/totp_web.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
